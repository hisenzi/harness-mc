name: Required publish flow

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/required-publish-flow.yml'
      - 'scripts/verify-required-publish-flow.mjs'
      - 'scripts/collab-root.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: required-publish-flow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOTYET_REF: d7414c4c68a23283cbe8b2b59e0744497ec71a92
    steps:
      - name: Check supported event source
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = pull_request ] && [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            echo '::error::This pilot supports same-repository PRs only; no private dependency credentials are provided to fork PRs.'
            exit 1
          fi

      - name: Check private dependency access is configured
        env:
          READ_TOKEN: ${{ secrets.NOTYET_HARNESS_READ_TOKEN }}
        run: |
          if [ -z "$READ_TOKEN" ]; then
            echo '::error::Configure NOTYET_HARNESS_READ_TOKEN with read-only Contents access to hisenzi/notyet-harness.'
            exit 1
          fi

      - name: Checkout proposed code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: harness-mc
          persist-credentials: false

      - name: Checkout pinned shared dependency
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: hisenzi/notyet-harness
          ref: ${{ env.NOTYET_REF }}
          token: ${{ secrets.NOTYET_HARNESS_READ_TOKEN }}
          path: notyet-harness
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /000_Agent/skills/heptabase-task-cards/SKILL.md
            /000_Agent/skills/heptabase-task-cards/scripts/create-task-cards.mjs
            /000_Agent/skills/heptabase-task-cards/scripts/create-task-cards.test.mjs
            /000_Agent/skills/vincent-superpowers/02-planning/SKILL.md
            /000_Agent/skills/project-init/SKILL.md
            /000_Agent/docs/agent-control-plane/visual-layer-transition-protocol.md

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Record exact checked inputs
        shell: bash
        run: |
          test "$(git -C notyet-harness rev-parse HEAD)" = "$NOTYET_REF"
          {
            printf '## Required publish flow inputs\n\n'
            printf 'harness-mc checked commit: `%s`\n\n' "$(git -C harness-mc rev-parse HEAD)"
            printf 'notyet-harness pinned commit: `%s`\n' "$NOTYET_REF"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify publish rules and adapter tests
        working-directory: harness-mc
        run: node scripts/verify-required-publish-flow.mjs

      - name: Record result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          printf '\nJob result: **%s**\n' "$RESULT" >> "$GITHUB_STEP_SUMMARY"
