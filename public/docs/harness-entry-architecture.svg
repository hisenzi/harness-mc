<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 820" width="100%" height="100%" style="display:block;margin:0 auto;max-width:100%;">
  <defs>
    <style><![CDATA[
      .canvas-bg { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .text-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; font-size: 13px; fill: #64748b; }
      .version-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #64748b; }
      .version-bg { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; }

      /* Outer Group Containers */
      .group-entries { fill: #fff7ed; stroke: #f97316; stroke-width: 1.5; }
      .group-anchor { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; }
      .group-core { fill: #f0f9ff; stroke: #0284c7; stroke-width: 1.5; }

      .group-label-entries { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif; font-size: 13px; font-weight: 700; fill: #c2410c; }
      .group-label-anchor { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif; font-size: 13px; font-weight: 700; fill: #15803d; }
      .group-label-core { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif; font-size: 14px; font-weight: 700; fill: #0369a1; }

      /* Cards inside Containers */
      .card-entry { fill: #ede9fe; stroke: #8b5cf6; stroke-width: 1; }
      .card-anchor { fill: #dcfce7; stroke: #22c55e; stroke-width: 1; }
      .card-core { fill: #e0f2fe; stroke: #38bdf8; stroke-width: 1; }

      .card-title-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; fill: #1e1b4b; }
      .card-title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif; font-size: 12.5px; font-weight: 700; fill: #0f172a; }
      .card-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif; font-size: 11px; fill: #334155; }
      .card-divider { stroke: #cbd5e1; stroke-width: 1; }

      /* Connectors & Arrows */
      .arrow-line { stroke: #475569; stroke-width: 1.5; fill: none; }
      .arrow-head { fill: #475569; }
      .arrow-label-bg { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; }
      .arrow-label-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif; font-size: 11px; fill: #334155; font-weight: 500; }

      /* Dark mode support */
      @media (prefers-color-scheme: dark) {
        .canvas-bg { fill: #0f172a; stroke: #334155; }
        .text-title { fill: #f8fafc; }
        .text-subtitle { fill: #94a3b8; }
        .version-bg { fill: #1e293b; stroke: #475569; }
        .version-tag { fill: #94a3b8; }

        .group-entries { fill: #431407; fill-opacity: 0.3; stroke: #ea580c; }
        .group-anchor { fill: #052e16; fill-opacity: 0.3; stroke: #16a34a; }
        .group-core { fill: #082f49; fill-opacity: 0.3; stroke: #0284c7; }

        .group-label-entries { fill: #fdba74; }
        .group-label-anchor { fill: #86efac; }
        .group-label-core { fill: #7dd3fc; }

        .card-entry { fill: #2e1065; fill-opacity: 0.6; stroke: #a78bfa; }
        .card-anchor { fill: #064e3b; fill-opacity: 0.6; stroke: #4ade80; }
        .card-core { fill: #0c4a6e; fill-opacity: 0.6; stroke: #38bdf8; }

        .card-title-code { fill: #ede9fe; }
        .card-title-text { fill: #f8fafc; }
        .card-desc { fill: #cbd5e1; }
        .card-divider { stroke: #475569; }

        .arrow-line { stroke: #94a3b8; }
        .arrow-head { fill: #94a3b8; }
        .arrow-label-bg { fill: #1e293b; stroke: #475569; }
        .arrow-label-text { fill: #cbd5e1; }
      }
    ]]></style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" class="arrow-head" />
    </marker>
  </defs>

  <!-- Canvas Frame -->
  <rect x="2" y="2" width="936" height="816" rx="12" class="canvas-bg" />

  <!-- Header -->
  <text x="36" y="38" class="text-title">MorroWise 啟動與解析鏈架構</text>
  <text x="36" y="58" class="text-subtitle">入口分流、每機唯一錨點與 CORE.md 三階導引關係（對齊 Issue #5 規範）</text>

  <rect x="726" y="24" width="178" height="24" rx="12" class="version-bg" />
  <text x="815" y="40" text-anchor="middle" class="version-tag">OPERATOR-GUIDE · Ch.1 v0.4.1</text>

  <!-- ==================== 1. ENTRIES SUBGRAPH (TOP) ==================== -->
  <g transform="translate(36, 75)">
    <rect x="0" y="0" width="868" height="150" rx="8" class="group-entries" />
    <text x="434" y="22" text-anchor="middle" class="group-label-entries">工具入口（薄路由）</text>

    <!-- Entry 1: Codex (依賴錨點群組) -->
    <g transform="translate(16, 32)">
      <rect x="0" y="0" width="195" height="102" rx="6" class="card-entry" />
      <text x="97" y="32" text-anchor="middle" class="card-title-code">~/.codex/AGENTS.md</text>
      <line x1="20" y1="44" x2="175" y2="44" class="card-divider" />
      <text x="97" y="64" text-anchor="middle" class="card-desc">→ $COLLAB/AGENTS.md</text>
      <text x="97" y="82" text-anchor="middle" class="card-desc">（全域薄轉接導向錨點）</text>
    </g>

    <!-- Entry 2: Antigravity (依賴錨點群組：相鄰並排) -->
    <g transform="translate(226, 32)">
      <rect x="0" y="0" width="195" height="102" rx="6" class="card-entry" />
      <text x="97" y="32" text-anchor="middle" class="card-title-text" style="font-size:13.5px;">Antigravity</text>
      <line x1="20" y1="44" x2="175" y2="44" class="card-divider" />
      <text x="97" y="64" text-anchor="middle" class="card-desc">workspace URI</text>
      <text x="97" y="82" text-anchor="middle" class="card-desc">（開啟根目錄即載入錨點）</text>
    </g>

    <!-- Entry 3: Claude Code (自帶定位群組) -->
    <g transform="translate(447, 32)">
      <rect x="0" y="0" width="200" height="102" rx="6" class="card-entry" />
      <text x="100" y="24" text-anchor="middle" class="card-title-code">~/.claude/CLAUDE.md</text>
      <text x="100" y="40" text-anchor="middle" class="card-desc" style="font-size:10.5px;">(symlink → cc-claude-md.md)</text>
      <line x1="20" y1="48" x2="180" y2="48" class="card-divider" />
      <text x="100" y="66" text-anchor="middle" class="card-desc">readlink 反推 $COLLAB</text>
      <text x="100" y="84" text-anchor="middle" class="card-desc">引用 CORE 解析順序</text>
    </g>

    <!-- Entry 4: notyet-harness Repo (自帶定位群組) -->
    <g transform="translate(657, 32)">
      <rect x="0" y="0" width="195" height="102" rx="6" class="card-entry" />
      <text x="97" y="30" text-anchor="middle" class="card-title-code">notyet-harness/AGENTS.md</text>
      <line x1="20" y1="48" x2="175" y2="48" class="card-divider" />
      <text x="97" y="66" text-anchor="middle" class="card-desc">同 repo 相對路徑</text>
      <text x="97" y="84" text-anchor="middle" class="card-desc">直讀 000_Agent/CORE.md</text>
    </g>
  </g>

  <!-- ==================== 2. ANCHOR SUBGRAPH (MIDDLE LEFT) ==================== -->
  <!-- 覆蓋 Codex 與 Antigravity 正下方，收斂兩大根目錄入口 -->
  <g transform="translate(36, 270)">
    <rect x="0" y="0" width="405" height="112" rx="8" class="group-anchor" />
    <text x="202" y="22" text-anchor="middle" class="group-label-anchor">錨點（每台機器唯一）</text>

    <g transform="translate(18, 32)">
      <rect x="0" y="0" width="369" height="68" rx="6" class="card-anchor" />
      <text x="184" y="24" text-anchor="middle" class="card-title-code">$COLLAB/AGENTS.md</text>
      <line x1="30" y1="33" x2="339" y2="33" class="card-divider" />
      <text x="184" y="48" text-anchor="middle" class="card-desc" style="font-weight:600;">$COLLAB resolves to: /Users/.../Claude_協作</text>
      <text x="184" y="62" text-anchor="middle" class="card-desc" style="font-size:10px;">（宣告本機唯一絕對路徑，提供 Startup Routing 導向 CORE）</text>
    </g>
  </g>

  <!-- ==================== 3. CORE SUBGRAPH (BOTTOM) ==================== -->
  <g transform="translate(36, 435)">
    <rect x="0" y="0" width="868" height="350" rx="8" class="group-core" />
    <text x="434" y="24" text-anchor="middle" class="group-label-core">CORE.md（唯一正本）</text>

    <!-- Block 1: Resolve Order (Center: x=234..634, mid=434) -->
    <g transform="translate(234, 36)">
      <rect x="0" y="0" width="400" height="84" rx="6" class="card-core" />
      <text x="200" y="22" text-anchor="middle" class="card-title-text">路徑規範 · 解析順序</text>
      <text x="200" y="42" text-anchor="middle" class="card-desc">(1) 平台入口 / workspace URI</text>
      <text x="200" y="58" text-anchor="middle" class="card-desc">(2) symlink target 反推</text>
      <text x="200" y="74" text-anchor="middle" class="card-desc">(3) 向 Vincent 確認</text>
    </g>

    <!-- Internal Connector 1 -> 2 -->
    <path d="M 434 120 L 434 138" class="arrow-line" marker-end="url(#arrow)" />

    <!-- Block 2: On-demand Reading -->
    <g transform="translate(234, 138)">
      <rect x="0" y="0" width="400" height="88" rx="6" class="card-core" />
      <text x="200" y="22" text-anchor="middle" class="card-title-text">按需閱讀</text>
      <line x1="60" y1="30" x2="340" y2="30" class="card-divider" />
      <text x="200" y="47" text-anchor="middle" class="card-desc" style="font-weight:600;">Session 必讀：CORE + SOUL + USER</text>
      <text x="200" y="64" text-anchor="middle" class="card-desc">按需：MEMORY / ARCHITECTURE</text>
      <text x="200" y="79" text-anchor="middle" class="card-desc">SKILLS-INDEX / identity</text>
    </g>

    <!-- Internal Connector 2 -> 3 -->
    <path d="M 434 226 L 434 244" class="arrow-line" marker-end="url(#arrow)" />

    <!-- Block 3: Task Routing & Stop Boundaries -->
    <g transform="translate(234, 244)">
      <rect x="0" y="0" width="400" height="88" rx="6" class="card-core" />
      <text x="200" y="22" text-anchor="middle" class="card-title-text">任務分流與停止邊界</text>
      <line x1="60" y1="30" x2="340" y2="30" class="card-divider" />
      <text x="200" y="47" text-anchor="middle" class="card-desc">唯讀 → 結論即交付</text>
      <text x="200" y="64" text-anchor="middle" class="card-desc">有限修改 → 完成即停</text>
      <text x="200" y="79" text-anchor="middle" class="card-desc">多步 / 跨系統 → 補規劃</text>
    </g>
  </g>

  <!-- ==================== CONNECTORS & ROUTING ARROWS ==================== -->
  <!-- 1. Codex -> Anchor (直落垂直線) -->
  <path d="M 149 209 L 149 268" class="arrow-line" marker-end="url(#arrow)" />
  <rect x="115" y="230" width="68" height="18" rx="3" class="arrow-label-bg" />
  <text x="149" y="243" text-anchor="middle" class="arrow-label-text">透過 root</text>

  <!-- 2. Antigravity -> Anchor (直落垂直線) -->
  <path d="M 359 209 L 359 268" class="arrow-line" marker-end="url(#arrow)" />
  <rect x="303" y="230" width="112" height="18" rx="3" class="arrow-label-bg" />
  <text x="359" y="243" text-anchor="middle" class="arrow-label-text">workspace URI 載入</text>

  <!-- 3. Anchor -> CORE Block 1 ($COLLAB 絕對路徑導引) -->
  <path d="M 238 382 L 238 513 L 268 513" class="arrow-line" marker-end="url(#arrow)" />
  <rect x="180" y="415" width="116" height="18" rx="3" class="arrow-label-bg" />
  <text x="238" y="428" text-anchor="middle" class="arrow-label-text">$COLLAB 絕對路徑</text>

  <!-- 4. Claude Code -> CORE Block 1 (直落垂直線，引用解析順序) -->
  <path d="M 547 209 L 547 469" class="arrow-line" marker-end="url(#arrow)" />
  <rect x="495" y="328" width="104" height="18" rx="3" class="arrow-label-bg" />
  <text x="547" y="341" text-anchor="middle" class="arrow-label-text">symlink 反推路徑</text>

  <!-- 5. notyet-harness -> CORE Block 1 (同 repo 相對路徑直連) -->
  <path d="M 754 209 L 754 513 L 672 513" class="arrow-line" marker-end="url(#arrow)" />
  <rect x="696" y="328" width="116" height="18" rx="3" class="arrow-label-bg" />
  <text x="754" y="341" text-anchor="middle" class="arrow-label-text">同 repo 相對路徑</text>

</svg>
