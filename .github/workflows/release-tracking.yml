      - name: Verify and relocate the original materials
        if: github.run_attempt != 1
        run: node core/scripts/release-tracking-actions.mjs restore --bundle work/original --event "$GITHUB_EVENT_PATH" --activation work/activation.json --checkout target --out work/bundle
      - name: Apply through the common CLI with a fresh local ledger
        env:
